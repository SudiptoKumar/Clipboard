name: Build LongPaste Keyboard APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also create a GitHub Release and attach the APK"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (used only when create_release is enabled)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.6.0"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate Gradle configuration
        run: gradle --no-daemon help --stacktrace

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongPaste-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: LongPaste Keyboard ${{ inputs.release_tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
